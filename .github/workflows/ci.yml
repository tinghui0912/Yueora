name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: System Integrity & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Design System Integrity Check
        run: npm run check:design-system

      - name: Code Quality (Lint)
        run: npm run lint

      - name: Type Safety Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Verify Production Auth Boundary
        run: npm run verify:auth-boundary
